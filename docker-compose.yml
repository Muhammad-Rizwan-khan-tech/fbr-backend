version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fbr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fbr_invoice_cloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fbr_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fbr_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/fbr_invoice_cloud
      - SECRET_KEY=fbr-cloud-super-secret-key-production-change
      - ADMIN_API_KEY=dev-admin-secret-key-change-in-production
      - FBR_DEFAULT_MODE=DEMO
    ports:
      - "8000:8000"

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: fbr_admin_panel
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - APP_NAME=FBR Invoice Cloud Super Admin
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8080
      - FASTAPI_URL=http://backend:8000
      - FASTAPI_ADMIN_KEY=dev-admin-secret-key-change-in-production
    ports:
      - "8080:80"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fbr_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
