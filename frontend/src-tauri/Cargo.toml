[package]
name = "fbr-invoice-cloud-desktop"
version = "1.0.0"
description = "FBR Invoice Cloud — Windows Desktop SaaS for Digital Tax Invoicing"
authors = ["FBR Invoice Cloud Platform"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
